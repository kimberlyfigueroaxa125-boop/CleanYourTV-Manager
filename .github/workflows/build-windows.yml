name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to attach the EXE to (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Auto-fix Ruff import ordering
        run: ruff check --select I --fix app tests

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest

  build:
    name: Build Windows executable
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean CleanYourTV-Manager.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Manager-Windows
          path: dist/CleanYourTV-Manager.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload $env:TAG_NAME dist/CleanYourTV-Manager.exe --clobber
