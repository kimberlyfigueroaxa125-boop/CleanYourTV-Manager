name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --windowed --name CleanYourTV-Manager app/main.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Manager-Windows
          path: dist/CleanYourTV-Manager
